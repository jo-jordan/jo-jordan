<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jo-jordan's Guitar</title>
<meta name="description" content="A gold T-style electric guitar in 3D. Move your cursor to tilt it, drag to spin, sweep across the strings to play.">
<style>
  :root { --bg: #0b0a0e; --fg: #f3e9d2; --muted: #a59a86; --gold: #e3a516; --line: rgba(243, 233, 210, .14);
          --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .hud { position: fixed; pointer-events: none; font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; font-size: 11px; color: var(--muted); }
  .tl { top: max(24px, env(safe-area-inset-top)); left: max(24px, env(safe-area-inset-left)); }
  .tl b { display: block; color: var(--fg); font-size: 13px; font-weight: 600; letter-spacing: .16em; }
  .bc { bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; padding: 0 16px; }
  .bc span { color: var(--gold); }
  .tr { top: max(20px, env(safe-area-inset-top)); right: max(20px, env(safe-area-inset-right)); pointer-events: auto; display: flex; gap: 8px; }
  .tr a, .tr button { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg); background: rgba(20, 18, 24, .7);
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; text-decoration: none; backdrop-filter: blur(6px); }
  .tr button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .tr a:focus-visible, .tr button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .render .hud { display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage" aria-label="3D gold T-style electric guitar"></canvas>
<div class="hud tl"><b>jo-jordan</b>Yidan Mao · Tokyo</div>
<div class="hud tr">
  <button id="sound" type="button" aria-pressed="false">Sound off</button>
  <a href="https://github.com/jo-jordan">GitHub</a>
</div>
<div class="hud bc">Move to tilt · drag to spin · <span>sweep across the strings to play</span></div>
<script type="module" src="guitar.js"></script>
</body>
</html>
