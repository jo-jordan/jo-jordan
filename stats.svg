<svg xmlns="http://www.w3.org/2000/svg" width="400" height="180" viewBox="0 0 400 180" role="img" aria-label="Yidan Mao GitHub stats">
<style>
  text { font-family: 'Segoe UI', Ubuntu, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .t { font-size: 15px; font-weight: 600; fill: #c0caf5; }
  .eb { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e0af68; letter-spacing: .08em; }
  .l { font-size: 13px; fill: #a9b1d6; }
  .v { font-size: 13px; font-weight: 600; fill: #c0caf5; font-variant-numeric: tabular-nums; }
  .s { font-size: 12px; fill: #565f89; }
  .m { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #565f89; letter-spacing: .1em; }
  .in { animation: in .6s ease-out backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .draw { animation: draw 2s ease-out .3s backwards; }
  @keyframes draw { from { stroke-dasharray: 2400; stroke-dashoffset: 2400; } to { stroke-dasharray: 2400; stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .in, .draw { animation: none; } }
</style>
<rect x=".5" y=".5" width="399" height="179" rx="10" fill="#1a1b26" stroke="#292e42"/>
<text class="eb" x="24" y="34">GITHUB STATS</text>
<text class="t" x="24" y="54">Yidan Mao</text>
<g class="in" style="animation-delay:0.08s"><circle cx="28" cy="80" r="3.5" fill="#e0af68"/><text class="l" x="40" y="84">Stars earned</text><text class="v" x="262" y="84" text-anchor="end">14</text></g>
<g class="in" style="animation-delay:0.16s"><circle cx="28" cy="101" r="3.5" fill="#7aa2f7"/><text class="l" x="40" y="105">Commits</text><text class="v" x="262" y="105" text-anchor="end">552</text></g>
<g class="in" style="animation-delay:0.24s"><circle cx="28" cy="122" r="3.5" fill="#bb9af7"/><text class="l" x="40" y="126">Pull requests</text><text class="v" x="262" y="126" text-anchor="end">36</text></g>
<g class="in" style="animation-delay:0.32s"><circle cx="28" cy="143" r="3.5" fill="#7dcfff"/><text class="l" x="40" y="147">Issues</text><text class="v" x="262" y="147" text-anchor="end">4</text></g>
<g class="in" style="animation-delay:0.40s"><circle cx="28" cy="164" r="3.5" fill="#9ece6a"/><text class="l" x="40" y="168">Repositories</text><text class="v" x="262" y="168" text-anchor="end">40</text></g>
<line x1="292" y1="40" x2="292" y2="160" stroke="#292e42"/>
<g class="in" style="animation-delay:0.48s"><text x="344" y="108" text-anchor="middle" style="font-size:44px;font-weight:700;fill:#e0af68">10</text><text class="m" x="344" y="132" text-anchor="middle">YEARS ON</text><text class="m" x="344" y="146" text-anchor="middle">GITHUB</text></g>
</svg>
